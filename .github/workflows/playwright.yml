
name: Playwright CI

on:
  push:
    branches: [b]
  pull_request:
    branches: [b]
  workflow_dispatch:

jobs:
  smoke-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Day10_Playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Day10_Playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Employee Ticket Application
        run: |
          cd ../Employee_Ticket_App
          python3 app.py > /tmp/ticket-app.log 2>&1 &
          for i in {1..15}; do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
              echo "Ticket application started successfully"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ticket-app.log
          exit 1
      - name: Run smoke tests
        run: npx playwright test --grep @smoke --project=chromium --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: playwright-html-report
          path: Day10_Playwright/playwright-report/
          retention-days: 7
